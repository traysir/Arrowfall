    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    // ============================================
    // AUDIO ANALYZER (for uploaded files)
    // ============================================
    const AudioAnalyzer = {
      async analyze(file) {
        const arrayBuffer = await file.arrayBuffer();
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        const channelData = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        const duration = audioBuffer.duration;
        const { beats, beatEnergies } = this.detectBeats(channelData, sampleRate);
        const bpm = this.estimateBPM(beats);
        audioContext.close();
        return { duration, bpm, beats, beatEnergies, beatCount: beats.length };
      },

      detectBeats(channelData, sampleRate) {
        const beats = [];
        const beatEnergies = [];
        const windowSize = Math.floor(sampleRate * 0.043);
        const hopSize = Math.floor(windowSize / 8);
        
        const energies = [];
        for (let i = 0; i < channelData.length - windowSize; i += hopSize) {
          let energy = 0;
          for (let j = 0; j < windowSize; j++) {
            const sample = channelData[i + j];
            energy += sample * sample;
          }
          energies.push({ time: i / sampleRate, energy: Math.sqrt(energy / windowSize) });
        }
        
        const maxEnergy = Math.max(...energies.map(e => e.energy));
        
        const smoothed = [];
        const sw = 5;
        for (let i = sw; i < energies.length - sw; i++) {
          let sum = 0;
          for (let j = -sw; j <= sw; j++) sum += energies[i + j].energy;
          smoothed.push({ time: energies[i].time, energy: sum / (sw * 2 + 1), rawEnergy: energies[i].energy });
        }
        
        const derivatives = [];
        for (let i = 1; i < smoothed.length; i++) {
          derivatives.push({ time: smoothed[i].time, derivative: smoothed[i].energy - smoothed[i - 1].energy, energy: smoothed[i].rawEnergy });
        }
        
        const sorted = [...derivatives].sort((a, b) => b.derivative - a.derivative);
        let threshold = sorted[Math.floor(sorted.length * 0.15)]?.derivative || 0;
        
        let lastBeat = -1;
        const minInterval = 0.22;
        
        for (let i = 10; i < derivatives.length - 10; i++) {
          const current = derivatives[i];
          if (current.derivative > threshold && current.derivative > 0) {
            let isLocalMax = true;
            for (let j = -5; j <= 5; j++) {
              if (j !== 0 && derivatives[i + j]?.derivative > current.derivative) { isLocalMax = false; break; }
            }
            if (isLocalMax && (current.time - lastBeat) >= minInterval) {
              beats.push(current.time);
              beatEnergies.push(current.energy / maxEnergy);
              lastBeat = current.time;
            }
          }
        }
        
        if (beats.length < 50) {
          const lowerThreshold = sorted[Math.floor(sorted.length * 0.25)]?.derivative || 0;
          beats.length = 0; beatEnergies.length = 0; lastBeat = -1;
          for (let i = 10; i < derivatives.length - 10; i++) {
            const current = derivatives[i];
            if (current.derivative > lowerThreshold && current.derivative > 0) {
              let isLocalMax = true;
              for (let j = -3; j <= 3; j++) {
                if (j !== 0 && derivatives[i + j]?.derivative > current.derivative) { isLocalMax = false; break; }
              }
              if (isLocalMax && (current.time - lastBeat) >= minInterval) {
                beats.push(current.time);
                beatEnergies.push(current.energy / maxEnergy);
                lastBeat = current.time;
              }
            }
          }
        }
        return { beats, beatEnergies };
      },

      estimateBPM(beats) {
        if (beats.length < 2) return 120;
        const intervals = [];
        for (let i = 1; i < Math.min(beats.length, 50); i++) intervals.push(beats[i] - beats[i - 1]);
        intervals.sort((a, b) => a - b);
        return Math.round(60 / intervals[Math.floor(intervals.length / 2)]);
      }
    };

    // ============================================
    // WAV ENCODER (for built-in synth songs)
    // ============================================
    function audioBufferToWav(buffer) {
      const numCh = buffer.numberOfChannels;
      const sr = buffer.sampleRate;
      const len = buffer.length;
      const bps = 16;
      const blockAlign = numCh * bps / 8;
      const dataBytes = len * blockAlign;
      const buf = new ArrayBuffer(44 + dataBytes);
      const v = new DataView(buf);
      const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(0,'RIFF'); v.setUint32(4, 36 + dataBytes, true); ws(8,'WAVE');
      ws(12,'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
      v.setUint16(22, numCh, true); v.setUint32(24, sr, true);
      v.setUint32(28, sr * blockAlign, true); v.setUint16(32, blockAlign, true);
      v.setUint16(34, bps, true); ws(36,'data'); v.setUint32(40, dataBytes, true);
      const channels = [];
      for (let i = 0; i < numCh; i++) channels.push(buffer.getChannelData(i));
      let o = 44;
      for (let i = 0; i < len; i++) {
        for (let ch = 0; ch < numCh; ch++) {
          const s = Math.max(-1, Math.min(1, channels[ch][i]));
          v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          o += 2;
        }
      }
      return new Blob([buf], { type: 'audio/wav' });
    }

    // ============================================
    // SYNTH ENGINE (procedural audio generation)
    // ============================================
    const SynthEngine = {
      noteToFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); },

      // Soft-clip curve for the distorted guitar bus
      makeDistCurve(amount) {
        const n = 1024, curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          const x = (i * 2) / n - 1;
          curve[i] = Math.tanh(amount * x);
        }
        return curve;
      },

      scheduleKick(ctx, dest, time, heavy = false) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        if (heavy) {
          // Metal kick: higher click attack, faster drop, more punch
          osc.frequency.setValueAtTime(220, time);
          osc.frequency.exponentialRampToValueAtTime(35, time + 0.08);
          g.gain.setValueAtTime(0.95, time);
          g.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
        } else {
          osc.frequency.setValueAtTime(150, time);
          osc.frequency.exponentialRampToValueAtTime(30, time + 0.12);
          g.gain.setValueAtTime(0.7, time);
          g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
        }
        osc.connect(g); g.connect(dest);
        osc.start(time); osc.stop(time + 0.31);
        if (heavy) {
          // Beater click so double-kick runs cut through
          const click = ctx.createOscillator();
          const cg = ctx.createGain();
          click.type = 'square';
          click.frequency.setValueAtTime(1800, time);
          cg.gain.setValueAtTime(0.12, time);
          cg.gain.exponentialRampToValueAtTime(0.001, time + 0.015);
          click.connect(cg); cg.connect(dest);
          click.start(time); click.stop(time + 0.02);
        }
      },

      scheduleSnare(ctx, dest, time, noiseBuf, heavy = false) {
        const ns = ctx.createBufferSource();
        ns.buffer = noiseBuf;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(heavy ? 0.5 : 0.3, time);
        ng.gain.exponentialRampToValueAtTime(0.001, time + (heavy ? 0.17 : 0.12));
        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = heavy ? 1300 : 2000;
        ns.connect(hp); hp.connect(ng); ng.connect(dest);
        ns.start(time); ns.stop(time + (heavy ? 0.18 : 0.13));
        const osc = ctx.createOscillator();
        const og = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(heavy ? 200 : 180, time);
        osc.frequency.exponentialRampToValueAtTime(heavy ? 70 : 80, time + 0.04);
        og.gain.setValueAtTime(heavy ? 0.5 : 0.35, time);
        og.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
        osc.connect(og); og.connect(dest);
        osc.start(time); osc.stop(time + 0.09);
      },

      scheduleHihat(ctx, dest, time, noiseBuf) {
        const ns = ctx.createBufferSource();
        ns.buffer = noiseBuf;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.1, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 8000; bp.Q.value = 1.5;
        ns.connect(bp); bp.connect(g); g.connect(dest);
        ns.start(time); ns.stop(time + 0.05);
      },

      scheduleNote(ctx, dest, freq, time, dur, type, vol, filterFreq) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        const safeTime = Math.max(0, time);
        g.gain.setValueAtTime(0, safeTime);
        g.gain.linearRampToValueAtTime(vol, safeTime + 0.008);
        g.gain.setValueAtTime(vol * 0.8, safeTime + dur * 0.7);
        g.gain.linearRampToValueAtTime(0, safeTime + dur);
        if (filterFreq) {
          const f = ctx.createBiquadFilter();
          f.type = 'lowpass'; f.frequency.value = filterFreq; f.Q.value = 1;
          osc.connect(f); f.connect(g);
        } else {
          osc.connect(g);
        }
        g.connect(dest);
        osc.start(safeTime); osc.stop(safeTime + dur + 0.01);
      },

      // Detuned power chord into the distorted guitar bus — the metal rhythm sound.
      // Low scale degrees play short (palm-mute chug), higher degrees ring out.
      scheduleChug(ctx, bus, rootFreq, time, dur, vol) {
        const safeTime = Math.max(0, time);
        const voices = [
          { mult: 1, detune: -7 },     // root
          { mult: 1, detune: 7 },      // doubled root, detuned (thickness)
          { mult: 1.5, detune: 0 },    // fifth
          { mult: 0.5, detune: 0 }     // sub octave (weight)
        ];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, safeTime);
        g.gain.linearRampToValueAtTime(vol, safeTime + 0.005);
        g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol * 0.25), safeTime + dur);
        g.gain.linearRampToValueAtTime(0, safeTime + dur + 0.02);
        g.connect(bus);
        voices.forEach(v => {
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = rootFreq * v.mult;
          osc.detune.value = v.detune;
          osc.connect(g);
          osc.start(safeTime); osc.stop(safeTime + dur + 0.03);
        });
      },

      getScaleFreq(key, scale, degree, octaveOffset) {
        const s = scale;
        const idx = ((degree % s.length) + s.length) % s.length;
        const oct = Math.floor(degree / s.length);
        return this.noteToFreq(key + s[idx] + (oct + octaveOffset) * 12);
      },

      async renderSong(song) {
        const sr = 44100;
        const ctx = new OfflineAudioContext(2, sr * song.duration, sr);
        const isHeavy = song.genre === 'heavy';

        const master = ctx.createGain();
        master.gain.value = isHeavy ? 0.42 : 0.6;
        // Compressor glues the mix and stops the distorted bus from clipping
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 10;
        comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.12;
        master.connect(comp); comp.connect(ctx.destination);

        // Distorted guitar bus (heavy songs only): saturation -> cab-style lowpass
        let guitarBus = null;
        if (isHeavy) {
          const shaper = ctx.createWaveShaper();
          shaper.curve = this.makeDistCurve(14);
          shaper.oversample = '2x';
          const cab = ctx.createBiquadFilter();
          cab.type = 'lowpass'; cab.frequency.value = 4200; cab.Q.value = 0.7;
          const body = ctx.createBiquadFilter();
          body.type = 'highpass'; body.frequency.value = 55;
          const busGain = ctx.createGain();
          busGain.gain.value = 0.34;
          shaper.connect(cab); cab.connect(body); body.connect(busGain); busGain.connect(master);
          guitarBus = shaper;
        }

        // Pre-create noise buffer
        const noiseBuf = ctx.createBuffer(1, sr, sr);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

        const beatDur = 60 / song.bpm;
        const stepDur = beatDur / 2;
        const spm = song.stepsPerMeasure || 8;
        const totalSteps = Math.floor(song.duration / stepDur);

        const beats = [];
        const beatEnergies = [];

        for (let step = 0; step < totalSteps; step++) {
          const time = step * stepDur;
          const ms = step % spm;
          const measure = Math.floor(step / spm);
          let energy = 0;

          // Drums
          if (song.kick && song.kick[ms]) { this.scheduleKick(ctx, master, time, isHeavy); energy = Math.max(energy, 0.9); }
          if (song.snare && song.snare[ms]) { this.scheduleSnare(ctx, master, time, noiseBuf, isHeavy); energy = Math.max(energy, 0.7); }
          if (song.hihat && song.hihat[ms]) { this.scheduleHihat(ctx, master, time, noiseBuf); energy = Math.max(energy, 0.3); }

          // Bass
          if (song.bassPattern) {
            const bp = song.bassPattern[measure % song.bassPattern.length];
            const deg = bp ? bp[ms] : undefined;
            if (deg !== null && deg !== undefined) {
              if (isHeavy) {
                // Bass rides an octave down, into the dirt
                const freq = this.getScaleFreq(song.key, song.scale, deg, -1);
                this.scheduleChug(ctx, guitarBus, freq, time, stepDur * 0.9, 0.5);
              } else {
                const freq = this.getScaleFreq(song.key, song.scale, deg, 0);
                this.scheduleNote(ctx, master, freq, time, stepDur * 1.8, song.bassType || 'sine', 0.28, 400);
              }
              energy = Math.max(energy, 0.5);
            }
          }

          // Melody / rhythm guitar
          if (song.melodyPattern) {
            const mp = song.melodyPattern[measure % song.melodyPattern.length];
            const deg = mp ? mp[ms] : undefined;
            if (deg !== null && deg !== undefined) {
              if (isHeavy) {
                // Power chords: low degrees chug short, high degrees ring
                const freq = this.getScaleFreq(song.key, song.scale, deg, 0);
                const isChug = deg <= 1;
                this.scheduleChug(ctx, guitarBus, freq, time, isChug ? stepDur * 0.55 : stepDur * 1.6, isChug ? 0.62 : 0.5);
              } else {
                const freq = this.getScaleFreq(song.key, song.scale, deg, 1);
                this.scheduleNote(ctx, master, freq, time, stepDur * 0.85, song.leadType || 'sawtooth', 0.18, 3000);
              }
              energy = Math.max(energy, 0.6);
            }
          }

          // Chords / Pads (skipped for heavy — pads soften the mix)
          if (song.chordPattern && !isHeavy) {
            const cp = song.chordPattern[measure % song.chordPattern.length];
            const deg = cp ? cp[ms] : undefined;
            if (deg !== null && deg !== undefined) {
              const root = this.getScaleFreq(song.key, song.scale, deg, 1);
              const fifth = this.getScaleFreq(song.key, song.scale, deg + 2, 1);
              this.scheduleNote(ctx, master, root, time, beatDur * 3.5, 'triangle', 0.07, 1500);
              this.scheduleNote(ctx, master, fifth, time, beatDur * 3.5, 'triangle', 0.05, 1500);
              energy = Math.max(energy, 0.4);
            }
          }

          if (energy > 0) {
            beats.push(time);
            beatEnergies.push(energy);
          }
        }

        const buffer = await ctx.startRendering();
        const blob = audioBufferToWav(buffer);
        const url = URL.createObjectURL(blob);
        return { url, duration: song.duration, bpm: song.bpm, beats, beatEnergies, title: song.title };
      }
    };

    // ============================================
    // NOTE GENERATOR
    // ============================================
    const NoteGenerator = {
      generate(beats, beatEnergies, difficulty) {
        const notes = [];
        const settings = GAME_CONFIG.DIFFICULTY[difficulty];
        const startDelay = GAME_CONFIG.START_DELAY;
        const minInterval = settings.minInterval || 0.25;
        
        const sortedEnergies = [...beatEnergies].sort((a, b) => b - a);
        const climaxThreshold = sortedEnergies[Math.floor(sortedEnergies.length * 0.12)] || 0.8;
        const highEnergyThreshold = sortedEnergies[Math.floor(sortedEnergies.length * 0.30)] || 0.6;
        const sustainThreshold = sortedEnergies[Math.floor(sortedEnergies.length * 0.65)] || 0.25;
        const sustainEndTimes = { left: 0, down: 0, up: 0, right: 0 };
        
        const filteredBeats = [];
        const filteredEnergies = [];
        let lastBeatTime = -Infinity;
        
        for (let i = 0; i < beats.length; i++) {
          if (beats[i] - lastBeatTime >= minInterval) {
            filteredBeats.push(beats[i]);
            filteredEnergies.push(beatEnergies[i]);
            lastBeatTime = beats[i];
          } else if (beatEnergies[i] > (filteredEnergies[filteredEnergies.length - 1] || 0)) {
            filteredBeats[filteredBeats.length - 1] = beats[i];
            filteredEnergies[filteredEnergies.length - 1] = beatEnergies[i];
            lastBeatTime = beats[i];
          }
        }
        
        filteredBeats.forEach((beatTime, index) => {
          const adjustedBeatTime = beatTime + startDelay;
          if (settings.skipPattern > 0 && index % settings.skipPattern !== 0) return;
          
          const energy = filteredEnergies[index] || 0;
          let notesToGenerate = settings.notesPerBeat;
          
          if (difficulty === 'hard') {
            notesToGenerate = energy >= climaxThreshold ? 3 : energy >= highEnergyThreshold ? 2 : 1;
          } else if (difficulty === 'medium') {
            notesToGenerate = energy >= climaxThreshold ? 2 : 1;
          } else {
            notesToGenerate = 1;
          }
          
          const usedLanes = new Set();
          
          for (let i = 0; i < notesToGenerate; i++) {
            let lane, attempts = 0;
            do { lane = LANES[Math.floor(Math.random() * LANES.length)]; attempts++; }
            while (usedLanes.has(lane) && attempts < 10);
            usedLanes.add(lane);
            
            const offset = notesToGenerate > 1 ? 0 : (i * 0.15);
            const noteTime = adjustedBeatTime + offset;
            
            const canBeSustain = notesToGenerate === 1 && energy >= sustainThreshold && 
              sustainEndTimes[lane] < noteTime && Math.random() < settings.sustainChance;
            
            let sustainDuration = 0;
            if (canBeSustain) {
              let nextBeatOnLane = Infinity;
              for (let j = index + 1; j < filteredBeats.length && j < index + 10; j++) {
                const timeDiff = filteredBeats[j] + startDelay - noteTime;
                if (timeDiff > GAME_CONFIG.SUSTAIN.minDuration) { nextBeatOnLane = filteredBeats[j] + startDelay; break; }
              }
              const maxAvailable = Math.min(nextBeatOnLane - noteTime - 0.1, GAME_CONFIG.SUSTAIN.maxDuration);
              if (maxAvailable >= GAME_CONFIG.SUSTAIN.minDuration) {
                sustainDuration = GAME_CONFIG.SUSTAIN.minDuration + (maxAvailable - GAME_CONFIG.SUSTAIN.minDuration) * energy;
                sustainEndTimes[lane] = noteTime + sustainDuration;
              }
            }
            
            notes.push({
              id: `${adjustedBeatTime}-${lane}-${i}`, lane, time: noteTime,
              hit: false, missed: false, isMultiNote: notesToGenerate > 1,
              isSustain: sustainDuration > 0, sustainDuration, sustainProgress: 0,
              sustainHeld: false, sustainCompleted: false
            });
          }
        });
        
        return notes.sort((a, b) => a.time - b.time);
      }
    };

    // ============================================
    // GAME LOOP HOOK
    // ============================================
    const useGameLoop = (isPlaying, isPaused, onTick) => {
      const frameRef = useRef(null);
      const elapsedRef = useRef(0);
      const lastTimeRef = useRef(0);

      useEffect(() => {
        if (!isPlaying) {
          elapsedRef.current = 0;
          if (frameRef.current) cancelAnimationFrame(frameRef.current);
          return;
        }
        if (isPaused) {
          if (frameRef.current) cancelAnimationFrame(frameRef.current);
          return;
        }
        lastTimeRef.current = performance.now();
        const tick = (currentTime) => {
          const deltaTime = (currentTime - lastTimeRef.current) / 1000;
          lastTimeRef.current = currentTime;
          elapsedRef.current += deltaTime;
          onTick(elapsedRef.current, deltaTime);
          frameRef.current = requestAnimationFrame(tick);
        };
        frameRef.current = requestAnimationFrame(tick);
        return () => { if (frameRef.current) cancelAnimationFrame(frameRef.current); };
      }, [isPlaying, isPaused, onTick]);
      return elapsedRef;
    };

    // ============================================
    // LANDING PARTICLES (Canvas)
    // ============================================
    const LandingParticles = ({ theme }) => {
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const mouseRef = useRef({ x: 0, y: 0 });
      
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);
        
        const count = Math.min(80, Math.floor(window.innerWidth / 20));
        particlesRef.current = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: Math.random() * 2.5 + 0.5,
          opacity: Math.random() * 0.5 + 0.1,
          hue: Math.random() * 30 - 15
        }));
        
        const handleMouse = (e) => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
        window.addEventListener('mousemove', handleMouse);
        
        const primaryRGB = hexToRGB(theme.primary);
        
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const particles = particlesRef.current;
          
          particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;
            
            const dx = mouseRef.current.x - p.x;
            const dy = mouseRef.current.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) {
              p.vx -= dx * 0.00008;
              p.vy -= dy * 0.00008;
            }
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${primaryRGB.r}, ${primaryRGB.g}, ${primaryRGB.b}, ${p.opacity})`;
            ctx.fill();
            
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const d = Math.sqrt((p.x - p2.x) ** 2 + (p.y - p2.y) ** 2);
              if (d < 120) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(${primaryRGB.r}, ${primaryRGB.g}, ${primaryRGB.b}, ${(1 - d / 120) * 0.15})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          });
          
          animId = requestAnimationFrame(draw);
        };
        
        draw();
        return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); window.removeEventListener('mousemove', handleMouse); };
      }, [theme.primary]);
      
      return <canvas ref={canvasRef} id="landing-particles" />;
    };

    // ============================================
    // AUDIO VISUALIZER (Canvas)
    // ============================================
    const AudioVisualizer = ({ audioElement, theme, isPlaying, enabled }) => {
      const canvasRef = useRef(null);
      const analyserRef = useRef(null);
      const sourceRef = useRef(null);
      const ctxRef = useRef(null);
      
      useEffect(() => {
        if (!audioElement || !isPlaying || !enabled) return;
        
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        if (!analyserRef.current) {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            const source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyserRef.current = analyser;
            sourceRef.current = source;
            ctxRef.current = audioCtx;
          } catch(e) { console.warn('Visualizer setup failed:', e); return; }
        }
        
        const analyser = analyserRef.current;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        let animId;
        const primaryRGB = hexToRGB(theme.primary);
        const secondaryRGB = hexToRGB(theme.secondary);
        
        const draw = () => {
          const w = canvas.parentElement?.clientWidth || canvas.width;
          const h = canvas.parentElement?.clientHeight || canvas.height;
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
          
          analyser.getByteFrequencyData(dataArray);
          ctx.clearRect(0, 0, w, h);
          
          const barCount = 64;
          const barWidth = w / barCount;
          const centerX = w / 2;
          
          for (let i = 0; i < barCount / 2; i++) {
            const val = dataArray[i + 2] / 255;
            const barHeight = val * h * 0.6;
            
            const gradient = ctx.createLinearGradient(0, h, 0, h - barHeight);
            gradient.addColorStop(0, `rgba(${primaryRGB.r}, ${primaryRGB.g}, ${primaryRGB.b}, 0.6)`);
            gradient.addColorStop(0.5, `rgba(${primaryRGB.r}, ${primaryRGB.g}, ${primaryRGB.b}, 0.3)`);
            gradient.addColorStop(1, `rgba(${secondaryRGB.r}, ${secondaryRGB.g}, ${secondaryRGB.b}, 0.05)`);
            
            ctx.fillStyle = gradient;
            const rx = centerX + i * barWidth;
            ctx.fillRect(rx, h - barHeight, barWidth - 1, barHeight);
            const lx = centerX - (i + 1) * barWidth;
            ctx.fillRect(lx, h - barHeight, barWidth - 1, barHeight);
          }
          
          animId = requestAnimationFrame(draw);
        };
        
        draw();
        return () => { cancelAnimationFrame(animId); };
      }, [audioElement, isPlaying, theme, enabled]);
      
      if (!enabled) return null;
      return <canvas ref={canvasRef} id="visualizer-canvas" />;
    };

    // ============================================

    const StatsModal = ({ isOpen, onClose, theme }) => {

      const profile = Profile.get();

      return (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[90] flex items-start sm:items-center justify-center overflow-y-auto p-4" onClick={onClose}>

    // ============================================
    // INFO MODAL (How to Play / Privacy Policy)
    // ============================================
    const InfoModal = ({ page, onClose, theme }) => {
      if (!page) return null;
      return (
        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[90] flex items-start sm:items-center justify-center overflow-y-auto p-4" onClick={onClose}>
          <div className="w-full max-w-xl p-6 my-8 animate-scale-in" onClick={e => e.stopPropagation()}
            style={{background: '#0c0c12', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '20px'}}>
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-xl font-black">{page === 'privacy' ? 'Privacy Policy' : 'How to Play'}</h2>
              <button onClick={onClose} className="btn btn-secondary w-9 h-9 rounded-xl text-sm">✕</button>
            </div>
            {page === 'howto' ? (
              <div className="text-sm text-neutral-300 space-y-3 leading-relaxed">
                <p><strong style={{color: theme.primary}}>Goal:</strong> Hit the arrows when they reach the glowing target zone at the bottom of each lane.</p>
                <p><strong style={{color: theme.primary}}>Controls:</strong> Arrow keys or WASD on desktop (switch in Settings). Tap the lanes on mobile.</p>
                <p><strong style={{color: theme.primary}}>Timing:</strong> PERFECT (gold) beats GOOD (green) beats OK (blue). Misses break your combo.</p>
                <p><strong style={{color: theme.primary}}>Sustain notes:</strong> Long notes with tails — press on time, then <em>hold</em> the key until the tail ends for bonus points.</p>
                <p><strong style={{color: theme.primary}}>Combos:</strong> Every consecutive hit multiplies your score. Protect the streak.</p>
                <p><strong style={{color: theme.primary}}>XP & Levels:</strong> Every song earns XP based on your score and grade. Level up, build a daily streak, and unlock all {ACHIEVEMENTS.length} achievements.</p>
                <p><strong style={{color: theme.primary}}>Daily Challenge:</strong> One featured song + difficulty per day, worth 2x XP.</p>
                <p><strong style={{color: theme.primary}}>Your music:</strong> Upload any MP3 or WAV and the beat detector builds a chart automatically.</p>
                <p className="text-neutral-500 text-xs pt-2">Tip: Press ESC to pause mid-song.</p>
              </div>
            ) : (
              <div className="text-sm text-neutral-400 space-y-3 leading-relaxed">
                <p className="text-neutral-500 text-xs">Last updated: June 2026</p>
                <p><strong className="text-neutral-200">What we store:</strong> Arrowfall saves your scores, settings, player level, and achievements in your browser's local storage. This data never leaves your device and is deleted if you clear your browser data.</p>
                <p><strong className="text-neutral-200">Uploaded music:</strong> Audio files you upload are processed entirely in your browser. They are never uploaded to any server.</p>
                <p><strong className="text-neutral-200">Advertising:</strong> This site may display ads served by Google AdSense. Google may use cookies (including the DoubleClick cookie) to serve ads based on your visits to this and other sites. You can opt out of personalized advertising at <span style={{color: theme.primary}}>google.com/settings/ads</span>. Third-party vendors' use of advertising cookies enables them and their partners to serve ads based on your browsing history.</p>
                <p><strong className="text-neutral-200">Analytics:</strong> We may use anonymous, aggregated analytics to understand how the game is played. No personally identifiable information is collected.</p>
                <p><strong className="text-neutral-200">Children:</strong> This game does not knowingly collect personal information from anyone, including children under 13.</p>
                <p><strong className="text-neutral-200">Contact:</strong> Questions? Reach out via the Arrowfall GitHub repository.</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // AD BREAK (between songs, every Nth play)
    // ============================================
    const AdBreak = ({ onContinue, theme }) => {
      const [countdown, setCountdown] = useState(5);
      useEffect(() => {
        if (countdown <= 0) return;
        const t = setTimeout(() => setCountdown(c => c - 1), 1000);
        return () => clearTimeout(t);
      }, [countdown]);

      return (
        <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[95] flex items-center justify-center p-4">
          <div className="text-center max-w-md w-full animate-scale-in">
            <div className="text-xs uppercase tracking-[4px] text-neutral-500 font-bold mb-4">Quick break</div>
            <div className="card-elevated p-4 mb-6 mx-auto" style={{background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '16px', minHeight: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
              {AD_CONFIG.enabled ? <AdSlot slot="adBreak" style={{width: '100%'}} /> : <span className="text-neutral-600 text-sm">Ads help keep Arrowfall free</span>}
            </div>
            <button onClick={onContinue} disabled={countdown > 0}
              className="btn px-8 py-3 rounded-xl font-bold text-white text-lg transition-all"
              style={{
                background: countdown > 0 ? 'rgba(255,255,255,0.08)' : theme.primary,
                boxShadow: countdown > 0 ? 'none' : `0 4px 24px ${theme.glow}`,
                cursor: countdown > 0 ? 'not-allowed' : 'pointer',
                opacity: countdown > 0 ? 0.6 : 1
              }}>
              {countdown > 0 ? `Continue in ${countdown}...` : 'Continue →'}
            </button>
          </div>
        </div>
      );
    };

    // ============================================
    // PAUSE OVERLAY
    // ============================================
    const PauseOverlay = ({ onResume, onRestart, onQuit, theme }) => (
      <div className="absolute inset-0 bg-black/88 backdrop-blur-md z-50 flex items-center justify-center">
        <div className="text-center animate-scale-in">
          <div className="text-5xl font-black mb-2" style={{color: theme.primary, textShadow: `0 0 40px ${theme.glow}`}}>PAUSED</div>
          <p className="text-neutral-500 text-sm mb-8">Press ESC to resume</p>
          <div className="flex flex-col gap-3 w-56 mx-auto">
            <button onClick={onResume} className="btn px-6 py-3 rounded-xl font-bold text-white"
              style={{background: theme.primary, boxShadow: `0 4px 24px ${theme.glow}`}}><Icon name="play" size={16} style={{marginRight: 8}} />Resume</button>
            <button onClick={onRestart} className="btn btn-secondary px-6 py-3 rounded-xl font-bold"><Icon name="restart" size={16} style={{marginRight: 8}} />Restart</button>
            <button onClick={onQuit} className="btn btn-secondary px-6 py-3 rounded-xl font-bold"><Icon name="close" size={15} style={{marginRight: 8}} />Quit song</button>
          </div>
        </div>
      </div>
    );

    // ============================================
    // RESULTS SCREEN
    // ============================================
    const ResultsScreen = ({ score, stats, maxCombo, accuracy, songData, theme, onPlayAgain, onNewSong, isNewBest, xpResult }) => {
      const grade = getGrade(parseFloat(accuracy));
      const totalNotes = stats.perfect + stats.good + stats.ok + stats.miss;
      const isFullCombo = totalNotes >= 10 && stats.miss === 0;
      const [shared, setShared] = useState(false);

      const handleShare = async () => {
        const text = `I just scored ${Math.round(score).toLocaleString()} (${grade.letter} rank, ${maxCombo}x combo) on "${songData?.title}" in Arrowfall! Can you beat it?`;
        const url = window.location.href.split('?')[0];
        try {
          if (navigator.share) { await navigator.share({ title: 'Arrowfall', text, url }); }
          else { await navigator.clipboard.writeText(`${text} ${url}`); setShared(true); setTimeout(() => setShared(false), 2000); }
        } catch (e) { /* user cancelled */ }
      };

      return (
        <div className="absolute inset-0 bg-black/92 flex items-center justify-center backdrop-blur-md z-50 overflow-y-auto">
          <div className="text-center px-6 py-8 max-w-lg w-full">
            <div className="mb-4" style={{animation: 'gradeReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) both'}}>
              <div className="text-[110px] font-black leading-none display-font" style={{
                color: grade.color,
                textShadow: `0 0 60px ${grade.glow}, 0 0 120px ${grade.glow}`
              }}>{grade.letter}</div>
              <div className="text-lg font-bold tracking-wider" style={{color: grade.color}}>{grade.label}</div>
            </div>
            
            <p className="text-neutral-400 mb-4 text-sm animate-fade-in" style={{animationDelay: '0.3s'}}>{songData?.title}</p>
            
            <div className="flex flex-wrap justify-center gap-2 mb-4">
              {isNewBest && (
                <div className="inline-block px-4 py-1 rounded-full text-sm font-bold animate-scale-in"
                  style={{background: `${theme.primary}25`, color: theme.primary, border: `1px solid ${theme.primary}40`, animationDelay: '0.4s'}}>
                  NEW PERSONAL BEST
                </div>
              )}
              {isFullCombo && (
                <div className="inline-block px-4 py-1 rounded-full text-sm font-bold animate-scale-in"
                  style={{background: 'rgba(251,191,36,0.15)', color: '#fbbf24', border: '1px solid rgba(251,191,36,0.4)', animationDelay: '0.45s'}}>
                  FULL COMBO
                </div>
              )}
              {xpResult?.isDaily && (
                <div className="inline-block px-4 py-1 rounded-full text-sm font-bold animate-scale-in"
                  style={{background: 'rgba(34,197,94,0.15)', color: '#22c55e', border: '1px solid rgba(34,197,94,0.4)', animationDelay: '0.5s'}}>
                  DAILY COMPLETE · 2X XP
                </div>
              )}
            </div>
            
            <div className="text-4xl font-bold mb-6 animate-slide-up display-font" style={{
              color: theme.primary, textShadow: `0 0 30px ${theme.glow}`, animationDelay: '0.5s'
            }}>{Math.round(score).toLocaleString()}</div>
            
            <div className="grid grid-cols-4 gap-3 mb-5">
              {[
                { label: 'Perfect', value: stats.perfect, color: '#fbbf24', delay: '0.6s' },
                { label: 'Good', value: stats.good, color: '#34d399', delay: '0.7s' },
                { label: 'OK', value: stats.ok, color: '#60a5fa', delay: '0.8s' },
                { label: 'Miss', value: stats.miss, color: '#f87171', delay: '0.9s' }
              ].map(s => (
                <div key={s.label} className="card p-3 animate-slide-up" style={{animationDelay: s.delay}}>
                  <div className="text-2xl font-black" style={{color: s.color}}>{s.value}</div>
                  <div className="text-[10px] text-neutral-500 uppercase tracking-wider font-bold mt-1">{s.label}</div>
                </div>
              ))}
            </div>
            
            <div className="flex justify-center gap-8 mb-5 text-sm animate-fade-in" style={{animationDelay: '1s'}}>
              <div>
                <span className="text-neutral-500">Max Combo </span>
                <span className="font-bold text-yellow-400">{maxCombo}x</span>
              </div>
              <div>
                <span className="text-neutral-500">Accuracy </span>
                <span className="font-bold" style={{color: theme.primary}}>{accuracy}%</span>
              </div>
              <div>
                <span className="text-neutral-500">Notes </span>
                <span className="font-bold text-neutral-300">{totalNotes}</span>
              </div>
            </div>

            {/* XP earned + level progress */}
            {xpResult && (
              <div className="mb-6 p-4 rounded-2xl text-left animate-fade-in" style={{background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', animationDelay: '1.05s'}}>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm font-bold" style={{color: theme.primary}}>+{xpResult.xpEarned.toLocaleString()} XP</span>
                  <span className="text-xs font-bold text-neutral-400">
                    {xpResult.leveledUp && <span className="mr-2" style={{color: '#fbbf24'}}>⬆ LEVEL UP!</span>}
                    Level {xpResult.level} · {titleForLevel(xpResult.level)}
                  </span>
                </div>
                <div className="h-2 bg-neutral-800 rounded-full overflow-hidden">
                  <div className="h-full rounded-full transition-all duration-700" style={{width: `${(xpResult.intoLevel / xpResult.needed) * 100}%`, background: `linear-gradient(90deg, ${theme.primary}, ${theme.secondary})`}}></div>
                </div>
                <div className="text-[10px] text-neutral-500 mt-1 text-right">{xpResult.intoLevel.toLocaleString()} / {xpResult.needed.toLocaleString()} XP to next level</div>
              </div>
            )}
            
            <div className="flex gap-3 justify-center animate-slide-up flex-wrap" style={{animationDelay: '1.1s'}}>
              <button onClick={onPlayAgain}
                className="btn px-8 py-3 rounded-xl font-bold text-white text-lg"
                style={{background: theme.primary, boxShadow: `0 4px 24px ${theme.glow}`}}>
                <Icon name="restart" size={17} style={{marginRight: 8}} />Replay
              </button>
              <button onClick={onNewSong} className="btn btn-secondary px-8 py-3 rounded-xl font-bold text-lg">
                New Song
              </button>
              <button onClick={handleShare} className="btn btn-secondary px-6 py-3 rounded-xl font-bold text-lg" title="Share your score">
                {shared ? 'Copied!' : <><Icon name="share" size={15} style={{marginRight: 8}} />Share</>}
              </button>
            </div>

            <AdSlot slot="resultsRect" style={{marginTop: '1.5rem'}} />
          </div>
        </div>
      );
    };

    // ============================================
    // LANDING PAGE
    // ============================================
    // Static mock of the play field — shows the game before you play it
    const GamePreview = () => {
      const lanes = ['left', 'down', 'up', 'right'];
      const floaters = [
        { lane: 0, top: '14%' }, { lane: 2, top: '8%' },
        { lane: 1, top: '36%' }, { lane: 3, top: '26%' },
        { lane: 2, top: '52%' }, { lane: 0, top: '58%' }
      ];
      return (
        <div className="relative w-full overflow-hidden" aria-hidden="true"
          style={{height: '420px', borderRadius: '24px', border: '1px solid rgba(255,255,255,0.08)',
            background: 'linear-gradient(180deg, #0a0a12 0%, #0d0d18 100%)',
            boxShadow: '0 24px 80px rgba(255,0,110,0.12), 0 8px 32px rgba(0,0,0,0.6)'}}>

            <span style={{fontSize: '0.65rem', fontWeight: 800, color: '#fbbf24'}}>47x</span>
          </div>
          {/* lanes */}
          <div className="absolute inset-0 flex">
            {lanes.map((lane, li) => (
              <div key={lane} className="relative flex-1" style={{borderRight: li < 3 ? '1px solid rgba(255,255,255,0.05)' : 'none'}}>
                <div className="absolute bottom-4 left-0 right-0 flex justify-center">
                  <div className="w-12 h-12 rounded-xl border-2 flex items-center justify-center"
                    style={{borderColor: 'rgba(255,0,110,0.35)', background: 'rgba(255,255,255,0.03)', color: 'rgba(255,255,255,0.8)', fontSize: '1.6rem'}}>
                    <LaneIcon dir={lane} />
                  </div>
                </div>
              </div>
            ))}
          </div>
          {/* judgment line */}
          <div className="absolute left-0 right-0" style={{top: '76%', height: '2px',
            background: 'linear-gradient(90deg, transparent, #ff006e 15%, #ff006e 85%, transparent)',
            boxShadow: '0 0 12px rgba(255,0,110,0.5)'}}></div>
          {/* falling notes */}
          <div className="absolute inset-0 preview-drift">
            {floaters.map((f, i) => (
              <div key={i} className="absolute flex items-center justify-center w-11 h-11 rounded-xl"
                style={{
                  left: `calc(${f.lane * 25}% + 12.5% - 22px)`, top: f.top,
                  background: 'linear-gradient(135deg, #ff006e, #d6336c)',
                  boxShadow: '0 0 14px rgba(255,0,110,0.4)',
                  color: 'white', fontSize: '1.5rem'
                }}>
                <LaneIcon dir={lanes[f.lane]} />
              </div>
            ))}
          </div>
          {/* PERFECT hit on the line */}
          <div className="absolute flex flex-col items-center" style={{left: 'calc(25% + 12.5% - 22px)', top: 'calc(76% - 22px)'}}>
            <div className="flex items-center justify-center w-11 h-11 rounded-xl"
              style={{background: '#fbbf24', boxShadow: '0 0 24px rgba(251,191,36,0.7)', color: '#1c1917', fontSize: '1.5rem'}}>
              <LaneIcon dir="down" />
            </div>
            <span className="display-font" style={{fontSize: '0.6rem', color: '#fbbf24', marginTop: '6px', letterSpacing: '1px'}}>PERFECT</span>
          </div>
          <div className="absolute inset-x-0 bottom-0 h-24 pointer-events-none"

    // ============================================
